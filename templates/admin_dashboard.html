<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ダッシュボード | 出欠管理システム</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50">
    <!-- ナビゲーションバー -->
    <nav class="bg-blue-600 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-white text-xl font-bold">
                        出席管理システム
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-white">管理者ダッシュボード</span>
                    <a href="/admin" class="text-white hover:text-gray-200 px-3 py-2 rounded-md text-sm font-medium">
                        管理画面
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- メインコンテンツ -->
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">管理者ダッシュボード</h1>
            <p class="text-gray-600">授業管理と出欠状況の確認</p>
        </div>

        <!-- 統計カード -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
            <!-- QRスキャナ -->
            <a href="/scan" class="bg-white rounded-2xl shadow-xl p-8 flex flex-col items-center min-h-[180px] hover:shadow-2xl transition duration-200 transform hover:scale-105">
                <div class="flex items-center justify-center w-24 h-24 rounded-full bg-blue-100 text-blue-600 mb-4">
                    <!-- QRコードスキャナのアイコン -->
                    <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="2"/>
                        <rect x="15" y="3" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="2"/>
                        <rect x="3" y="15" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="2"/>
                        <rect x="15" y="15" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="2"/>
                        <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
                    </svg>
                </div>
                <p class="text-xl font-bold text-gray-900 mt-2">QRスキャナ</p>
                <p class="text-sm text-gray-500 mt-2">出席を記録する</p>
            </a>

            <!-- 出席率 -->
            <a href="/" class="bg-white rounded-2xl shadow-xl p-8 flex flex-col items-center min-h-[180px] hover:shadow-2xl transition duration-200 transform hover:scale-105">
                <div class="flex items-center justify-center w-24 h-24 rounded-full bg-green-100 text-green-600 mb-4">
                    <!-- 出席率のアイコン（ユーザーグループ） -->
                    <svg class="w-16 h-16" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <p class="text-xl font-bold text-gray-900 mt-2">出席率</p>
                <p class="text-sm text-gray-500 mt-2">出席状況を確認</p>
            </a>

            <!-- 時間割変更 -->
            <a href="/admin" class="bg-white rounded-2xl shadow-xl p-8 flex flex-col items-center min-h-[180px] hover:shadow-2xl transition duration-200 transform hover:scale-105">
                <div class="flex items-center justify-center w-24 h-24 rounded-full bg-yellow-100 text-yellow-600 mb-4">
                    <!-- 時間割変更のアイコン（カレンダー＋時計） -->
                    <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
                        <circle cx="16.5" cy="15.5" r="2.5" stroke="currentColor" stroke-width="2"/>
                        <path d="M16.5 15.5V13M16.5 15.5H14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <p class="text-xl font-bold text-gray-900 mt-2">授業管理</p>
                <p class="text-sm text-gray-500 mt-2">授業を管理する</p>
            </a>
        </div>

        <!-- クイックアクセス -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">クイックアクセス</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <a href="/qr/S001" class="flex items-center p-4 border border-gray-200 rounded-lg hover:bg-blue-50 hover:border-blue-300 transition duration-200">
                    <svg class="w-8 h-8 text-blue-600 mr-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
                    </svg>
                    <div>
                        <p class="font-semibold text-gray-800">QRコード生成</p>
                        <p class="text-sm text-gray-500">学生用QRコードを生成</p>
                    </div>
                </a>
                
                <a href="/scan" class="flex items-center p-4 border border-gray-200 rounded-lg hover:bg-green-50 hover:border-green-300 transition duration-200">
                    <svg class="w-8 h-8 text-green-600 mr-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <div>
                        <p class="font-semibold text-gray-800">出席記録</p>
                        <p class="text-sm text-gray-500">QRコードをスキャン</p>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
